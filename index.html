
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Original PC</title>

<style>
    body {
        background: #171717;
        color: #eeeeee;
        font-family: monospace;
        text-align: center;
        padding: 30px 15px;
    }

    h1 {
        color: #00ff88;
    }

    #screen {
        background: #000;
        color: #00ff00;
        border: 4px solid #555;
        border-radius: 8px;
        max-width: 750px;
        min-height: 200px;
        margin: 25px auto;
        padding: 20px;
        text-align: left;
        box-sizing: border-box;
        white-space: pre-wrap;
    }

    #emulator-area {
        display: none;
        max-width: 750px;
        margin: 20px auto;
        background: #000;
        border: 4px solid #00ff88;
        padding: 10px;
        box-sizing: border-box;
    }

    #screen_container {
        background: #000;
        color: #fff;
        overflow: auto;
        text-align: left;
    }

    #screen_container > div {
        white-space: pre;
        font: 14px monospace;
        line-height: 14px;
    }

    #screen_container canvas {
        max-width: 100%;
        height: auto;
    }

    button {
        background: #333;
        color: white;
        border: 2px solid #00ff88;
        padding: 12px 30px;
        font-size: 18px;
        cursor: pointer;
        border-radius: 6px;
    }

    button:hover {
        background: #006633;
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
</style>
</head>

<body>

<h1>MY ORIGINAL PC</h1>
<p>Original x86 Computer Project</p>

<div id="screen">
MY ORIGINAL PC BIOS

Power is OFF.
</div>

<button id="powerButton" onclick="powerOn()">
電源を入れる
</button>

<div id="emulator-area">
    <h3>VIRTUAL PC DISPLAY</h3>
    <p id="v86-status">Initializing...</p>

    <div id="screen_container">
        <div></div>
        <canvas style="display:none"></canvas>
    </div>
</div>

<!-- v86 Emulator -->
<script src="./v86/libv86.js"></script>

<script>
let emulator = null;
let poweredOn = false;

function powerOn() {

    if (poweredOn) return;
    poweredOn = true;

    const screen = document.getElementById("screen");
    const button = document.getElementById("powerButton");

    button.disabled = true;

    screen.textContent = "MY ORIGINAL PC BIOS\n\n";
    screen.textContent += "Power ON...\n";

    setTimeout(() => {

        screen.textContent += "CPU: Checking...\n";
        screen.textContent += "Memory: Checking...\n";
        screen.textContent += "IDE: Checking...\n";

        screen.textContent += "\nPOST completed.\n";
        screen.textContent += "Starting x86 Emulator...\n";

        startV86();

    }, 700);
}

function startV86() {

    const area = document.getElementById("emulator-area");
    const status = document.getElementById("v86-status");

    area.style.display = "block";
    status.textContent = "Loading v86...";

    if (typeof V86 === "undefined") {
        status.textContent =
            "ERROR: libv86.js could not be loaded.";
        return;
    }

    try {

        emulator = new V86({

            wasm_path: "./v86/v86.wasm",

            memory_size: 64 * 1024 * 1024,
            vga_memory_size: 8 * 1024 * 1024,

            screen_container:
                document.getElementById("screen_container"),

            bios: {
                url: "./seabios.bin"
            },

            vga_bios: {
                url: "./vgabios.bin"
            },

            autostart: true

        });

        emulator.add_listener("emulator-ready", function() {
            status.textContent =
                "V86 READY - Virtual PC Started";
        });

    } catch (error) {

        status.textContent =
            "ERROR: " + error.message;

        console.error(error);
    }
}
</script>

</body>
</html>
