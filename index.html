
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Original PC</title>

<style>
    body {
        background: #171717;
        color: #eeeeee;
        font-family: monospace;
        text-align: center;
        padding: 30px 15px;
    }

    h1 {
        color: #00ff88;
    }

    #screen {
        background: #000;
        color: #00ff00;
        border: 4px solid #555;
        border-radius: 8px;
        max-width: 750px;
        min-height: 300px;
        margin: 25px auto;
        padding: 20px;
        text-align: left;
        box-sizing: border-box;
        white-space: pre-wrap;
    }

    button {
        background: #333;
        color: white;
        border: 2px solid #00ff88;
        padding: 12px 30px;
        font-size: 18px;
        cursor: pointer;
        border-radius: 6px;
    }

    button:hover {
        background: #006633;
    }
</style>
</head>

<body>

<h1>MY ORIGINAL PC</h1>
<p>Original x86 Computer Project</p>

<div id="screen">
MY ORIGINAL PC BIOS

Power is OFF.
</div>

<button onclick="powerOn()">電源を入れる</button>

<script>
function powerOn() {
    const screen = document.getElementById("screen");

    screen.textContent = "MY ORIGINAL PC BIOS\n\n";
    screen.textContent += "Power ON...\n";

    setTimeout(() => {
        screen.textContent += "CPU: Checking...\n";
        screen.textContent += "Memory: Checking...\n";
        screen.textContent += "IDE: Checking...\n";
        screen.textContent += "\nPOST completed.\n";
        screen.textContent += "No boot device configured.\n";
        screen.textContent += "\nBIOS setup complete.";
    }, 700);
}
</script>

</body>
</html>
